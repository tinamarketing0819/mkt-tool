  <h2>Meta訊息廣告費試算</h2>

  <div class="field">

  <button type="button" onclick="calculateMetaBudget()">計算廣告費</button>

    <form 
      action="https://gmail.us18.list-manage.com/subscribe/post-json?u=d8aec5c2dc0113ac6f6838390&id=b57987c492&f_id=00bcace6f0"
      method="post" 
      id="mc-embedded-subscribe-form" 
      name="mc-embedded-subscribe-form"
      onsubmit="return submitMailchimpForm(event)"
      novalidate
    >

      </div>

      <div class="hidden-field" aria-hidden="true">
        <input type="text" name="b_d8aec5c2dc0113ac6f6838390_b57987c492" tabindex="-1" value="">
      </div>

      <input type="submit" name="subscribe" id="mc-embedded-subscribe" value="送出">
      <div id="mcMessage" class="mc-message" aria-live="polite"></div>

  <script>
    let countdownSeconds = (3 * 24 * 60 * 60) + (19 * 60);
    let countdownStarted = false;
    let countdownInterval = null;

    function formatMoney(value) {
      return "$" + Number(value || 0).toLocaleString("zh-TW") + "元";
    }

    function updateMessagePreview() {
      const dailyMessages = Number(document.getElementById("dailyMessages").value);
      return dailyMessages > 0 ? dailyMessages : 0;
    }

    function animateServicePieChart() {
      const pieChart = document.getElementById("servicePieChart");
      if (!pieChart) return;
      pieChart.classList.remove("animate");
      void pieChart.offsetWidth;
      pieChart.classList.add("animate");
    }

    function padTime(value) {
      return String(value).padStart(2, "0");
    }

    function updateCountdownDisplay() {
      const countdownTimer = document.getElementById("countdownTimer");
      if (!countdownTimer) return;

      const days = Math.floor(countdownSeconds / 86400);
      const hours = Math.floor((countdownSeconds % 86400) / 3600);
      const minutes = Math.floor((countdownSeconds % 3600) / 60);
      const seconds = countdownSeconds % 60;

      countdownTimer.textContent = padTime(days) + "天" + padTime(hours) + "小時" + padTime(minutes) + "分" + padTime(seconds) + "秒";
    }

    function startCountdown() {
      updateCountdownDisplay();
      if (countdownStarted) return;

      countdownStarted = true;
      countdownInterval = setInterval(function() {
        if (countdownSeconds > 0) {
          countdownSeconds -= 1;
          updateCountdownDisplay();
        } else {
          clearInterval(countdownInterval);
        }
      }, 1000);
    }

    function calculateMetaBudget() {
      const metaMessageCost = Number(document.getElementById("metaMessageCost").value);
      const dailyMessages = Number(document.getElementById("dailyMessages").value);
      const resultBox = document.getElementById("resultBox");
      const resultAmount = document.getElementById("resultAmount");
      const errorMessage = document.getElementById("errorMessage");
      const mailchimpFormWrap = document.getElementById("mailchimpFormWrap");
      const budgetInput = document.getElementById("mce-MMERGE11");
      const monthlyTargetMessagesAmount = document.getElementById("monthlyTargetMessagesAmount");

      if (!metaMessageCost || !dailyMessages || metaMessageCost <= 0 || dailyMessages <= 0) {
        resultBox.style.display = "none";
        mailchimpFormWrap.style.display = "none";
        errorMessage.style.display = "block";
        updateMessagePreview();
        monthlyTargetMessagesAmount.textContent = "0";
        return;
      }

      const dailyTargetMessages = updateMessagePreview();
      const monthlyTargetMessages = dailyTargetMessages * 30;
      const monthlyBudget = monthlyTargetMessages * metaMessageCost;

      resultAmount.textContent = formatMoney(monthlyBudget);
      monthlyTargetMessagesAmount.textContent = monthlyTargetMessages.toLocaleString("zh-TW");
      budgetInput.value = monthlyBudget;

      errorMessage.style.display = "none";
      resultBox.style.display = "block";
      mailchimpFormWrap.style.display = "block";
      animateServicePieChart();
      startCountdown();

      setTimeout(function() {
        mailchimpFormWrap.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }, 150);
    }

    function setMailchimpMessage(type, text) {
      const messageBox = document.getElementById("mcMessage");
      messageBox.className = "mc-message " + type;
      messageBox.textContent = text;
    }

    function cleanMailchimpMessage(message) {
      return String(message || "")
        .replace(/<[^>]*>/g, "")
        .replace(/^\d+\s*-\s*/, "")
        .replace(/&amp;/g, "&")
        .replace(/&lt;/g, "<")
        .replace(/&gt;/g, ">")
        .trim();
    }

    function validateRequiredFields(form) {
      const fields = [
        { id: "mce-EMAIL", label: "Email Address" },
        { id: "mce-COMPANY", label: "公司抬頭" },
        { id: "mce-NAME", label: "聯絡人姓名" },
        { id: "mce-PHONE", label: "聯絡電話" },
        { id: "mce-MMERGE9", label: "公司統編" },
        { id: "mce-MMERGE11", label: "預估廣告費" }
      ];

      for (const field of fields) {
        const input = document.getElementById(field.id);
        if (!input || !String(input.value).trim()) {
          setMailchimpMessage("error", "請填寫「" + field.label + "」。");
          if (input) input.focus();
          return false;
        }
      }

      const emailInput = document.getElementById("mce-EMAIL");
      const emailValue = emailInput.value.trim();
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!emailPattern.test(emailValue)) {
        setMailchimpMessage("error", "請填寫有效的 Email Address。");
        emailInput.focus();
        return false;
      }

      return true;
    }

    function submitMailchimpForm(event) {
      event.preventDefault();

      const form = document.getElementById("mc-embedded-subscribe-form");
      const submitButton = document.getElementById("mc-embedded-subscribe");
      const messageBox = document.getElementById("mcMessage");

      messageBox.className = "mc-message";
      messageBox.textContent = "";

      if (!validateRequiredFields(form)) {
        return false;
      }

      submitButton.disabled = true;
      submitButton.value = "送出中...";

      const callbackName = "mcCallback_" + Date.now();
      const formData = new FormData(form);
      const params = new URLSearchParams();

      formData.forEach(function(value, key) {
        params.append(key, String(value).trim());
      });

      window[callbackName] = function(response) {
        submitButton.disabled = false;
        submitButton.value = "送出";

        if (response && response.result === "success") {
          setMailchimpMessage("success", "送出成功！感謝您的填寫，我將盡快與您聯繫。");
          form.reset();
        } else {
          const errorText = cleanMailchimpMessage(response && response.msg ? response.msg : "送出失敗，請確認欄位內容後再試一次。");
          setMailchimpMessage("error", errorText || "送出失敗，請確認欄位內容後再試一次。");
        }

        messageBox.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

        const oldScript = document.getElementById(callbackName);
        if (oldScript) oldScript.remove();

        try {
          delete window[callbackName];
        } catch (e) {
          window[callbackName] = undefined;
        }
      };

      const script = document.createElement("script");
      script.id = callbackName;
      script.src = form.action + "&" + params.toString() + "&c=" + callbackName;

      script.onerror = function() {
        submitButton.disabled = false;
        submitButton.value = "送出";
        setMailchimpMessage("error", "送出失敗，請檢查網路連線或稍後再試。");

        const oldScript = document.getElementById(callbackName);
        if (oldScript) oldScript.remove();

        try {
          delete window[callbackName];
        } catch (e) {
          window[callbackName] = undefined;
        }
      };

      document.body.appendChild(script);
      return false;
    }

    updateMessagePreview();
    updateCountdownDisplay();
  </script>
